<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Alterna · Анкара B2 · дни маршрута</title>
<link rel="stylesheet" href="kit/v1/lexicon-fonts.css">
<style>
  :root { --bg: #f6f5f2; --surf: #fff; --ink: #2e3440; --muted: #5c6370; --line: #e3e0d9; --acc: #8a3b2f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 'LX Manrope', system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-left)) 64px max(16px, env(safe-area-inset-right)); }
  h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li > a, li > span { display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; align-items: baseline;
    padding: 14px 16px; border-radius: 14px; background: var(--surf); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  li > a:hover { border-color: var(--acc); }
  li.off > span { opacity: .5; background: transparent; }
  b { font-size: 20px; color: var(--acc); font-variant-numeric: tabular-nums; }
  .t { font-weight: 700; }
  .t small { display: block; font-weight: 500; color: var(--muted); }
  .u { grid-column: 2; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <h1>Анкара · B2</h1>
  <p class="sub">Дни маршрута Alterna: интерактивные уроки по дневным темам столицы. Готово <!--COUNT-->.</p>
  <ol>
<!--DAYS-->
  </ol>
</main>
</body>
</html>
